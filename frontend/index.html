<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAM LABS — Digital Manufacturing & Precision 3D Printing Platform</title>
    <meta name="description" content="On-demand digital manufacturing platform for high-precision 3D printing (SLS, SLA, FDM, DMLS), CNC machining, sheet metal fabrication, and rapid prototyping." />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.png" />
    <script>
      (function () {
        try {
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var saved = window.localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (prefersLight ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="tech-grid-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
